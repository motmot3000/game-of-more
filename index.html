<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // The app may be served under a sub-path (e.g. /game-of-more). Relative
      // URLs — assets and the /api routes alike — only resolve correctly when
      // the path ends with a slash, so restore it before anything else loads.
      // A last segment containing a dot is a file (index.html): leave it alone.
      const last = location.pathname.split("/").pop();
      if (last && !last.includes(".")) {
        location.replace(location.pathname + "/" + location.search + location.hash);
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Game of More — turn your English class into an epic adventure." />
    <meta name="theme-color" content="#241a3f" />
    <title>Game of More</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="sky-decor" aria-hidden="true"></div>
    <div id="app"></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="modal-root"></div>
    <script type="module" src="./src/app.mjs"></script>
  </body>
</html>
